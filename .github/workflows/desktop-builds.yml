name: Desktop builds

# Packaging is driven by Releases: publishing a release builds every platform and
# attaches the installers to it.
#
# The previous trigger listed src/** and src-tauri/**, so the full three-platform
# matrix plus an Arch container build ran on very nearly every pull request — a lot
# of runner time to prove something the release itself proves.
on:
  release:
    types: [published]
  workflow_dispatch:
  # Only for changes that can break packaging without touching application code.
  # Deliberately narrow: application sources are covered by the CI workflow.
  pull_request:
    paths:
      - ".github/workflows/desktop-builds.yml"
      - "buildResources/**"
      - "packaging/**"
      - "scripts/generate-icons.cjs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/tauri.windows.conf.json"

permissions:
  contents: write

jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Choose the build matrix for this event
        id: pick
        env:
          LINUX: '{"name":"Linux · AppImage, DEB, RPM","runner":"ubuntu-22.04","rust_targets":"","args":"--bundles appimage,deb,rpm"}'
          MACOS: '{"name":"macOS · Universal","runner":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin --bundles app,dmg"}'
          WINDOWS: '{"name":"Windows · MSI, NSIS","runner":"windows-latest","rust_targets":"","args":"--bundles msi,nsis"}'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # One platform is enough to show the bundle definition still builds.
            printf 'include=[%s]\n' "$LINUX" >> "$GITHUB_OUTPUT"
          else
            printf 'include=[%s,%s,%s]\n' "$LINUX" "$MACOS" "$WINDOWS" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: ${{ matrix.name }}
    needs: platforms
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned to match src-tauri/rust-toolchain.toml. Clippy runs with
      # -D warnings, so a floating channel lets a new Rust release fail CI on
      # untouched code.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-${{ matrix.runner }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # On a release this also asserts the tag matches the application version, so
      # a mistagged release fails before any installer is attached to it.
      - name: Verify synchronized release version
        run: npm run check:version

      - name: Build desktop packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "localhost-hub-[version]-[platform]-[arch]-[bundle]"
          # Attach to the release that triggered this run. Empty on other events,
          # which leaves the packages as workflow artifacts only.
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}
          releaseAssetNamePattern: "localhost-hub-[version]-[platform]-[arch]-[bundle][setup][ext]"

      - name: Prepare Arch package input
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: cp src-tauri/target/release/bundle/deb/*.deb packaging/arch/localhost-hub.deb

      - name: Build Arch package
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist-arch
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm
              useradd --create-home builder
              cp -R /workspace/packaging/arch /tmp/localhost-hub-arch
              chown -R builder:builder /tmp/localhost-hub-arch
              su builder -c "cd /tmp/localhost-hub-arch && makepkg --nodeps --noconfirm"
              cp /tmp/localhost-hub-arch/*.pkg.tar.zst /workspace/dist-arch/
            '

      - name: Upload Arch workflow artifact
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: localhost-hub-${{ github.sha }}-arch-x86_64
          path: dist-arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      - name: Attach Arch package to the release
        if: runner.os == 'Linux' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-arch/*.pkg.tar.zst --clobber
