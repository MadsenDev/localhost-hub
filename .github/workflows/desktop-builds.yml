name: Desktop builds

# Packaging is driven by tags: pushing v* builds every platform, drafts the release,
# and attaches the installers to it. The release stays a draft, so it is reviewable
# with its packages already on it and nobody can download a release that has none.
# Publishing it is a human decision, and the last one.
#
# Release prep (release-prep.yml) is what pushes the tag — and it also has to start
# this workflow explicitly, because GitHub does not start workflows from events created
# with the default GITHUB_TOKEN. So the run for a release arrives as a
# `workflow_dispatch` against the tag rather than as a tag push. Both look the same
# here: the jobs below key off `github.ref_type == 'tag'`, not off the event name, so a
# real tag push and a dispatch against a tag behave identically. A manual run against a
# branch still just produces artifacts.
#
# Publishing a release by hand still works and still builds — that was the only trigger
# before, and the three releases that predate this workflow were packaged by hand.
#
# The trigger used to list src/** and src-tauri/**, so the full three-platform matrix
# plus an Arch container build ran on very nearly every pull request — a lot of runner
# time to prove something the release itself proves.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
  # Only for changes that can break packaging without touching application code.
  # Deliberately narrow: application sources are covered by the CI workflow.
  pull_request:
    paths:
      - ".github/workflows/desktop-builds.yml"
      - "buildResources/**"
      - "packaging/**"
      - "scripts/generate-icons.cjs"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/tauri.windows.conf.json"

permissions:
  contents: write

jobs:
  platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Choose the build matrix for this event
        id: pick
        env:
          LINUX: '{"name":"Linux · AppImage, DEB, RPM","runner":"ubuntu-22.04","rust_targets":"","args":"--bundles appimage,deb,rpm"}'
          MACOS: '{"name":"macOS · Universal","runner":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin --bundles app,dmg"}'
          WINDOWS: '{"name":"Windows · MSI, NSIS","runner":"windows-latest","rust_targets":"","args":"--bundles msi,nsis"}'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # One platform is enough to show the bundle definition still builds.
            printf 'include=[%s]\n' "$LINUX" >> "$GITHUB_OUTPUT"
          else
            printf 'include=[%s,%s,%s]\n' "$LINUX" "$MACOS" "$WINDOWS" >> "$GITHUB_OUTPUT"
          fi

  # Creates the draft the packages attach to, once, before the matrix fans out — three
  # jobs each creating their own release would leave three drafts holding a third of
  # the installers each.
  #
  # The job runs on every event so that `needs` is satisfied and the matrix is never
  # skipped; its steps are what is conditional. On a published release the id comes
  # from the event instead, and this outputs nothing.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Check out repository
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.ref_type == 'tag'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draft the release for this tag
        id: draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Re-running this workflow for the same tag must reuse the draft rather than
          # add another. Drafts are absent from the by-tag endpoint, so this lists.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
          if [ -n "$existing" ]; then
            echo "::notice::Reusing existing release ${existing} for ${TAG}."
            echo "release_id=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${TAG#v}"

          # The notes are the changelog section the release commit already carries, so
          # the release body and the file in the tree cannot disagree.
          node scripts/release-notes.cjs "$version" > notes.md

          # A version with a prerelease identifier is marked as one, so an alpha does
          # not present itself as the latest stable release.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          id=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$version" \
            --rawfile body notes.md \
            --argjson prerelease "$prerelease" \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: $prerelease}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - --jq .id)

          echo "::notice::Drafted release ${id} for ${TAG} (prerelease: ${prerelease})."
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: [platforms, draft]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pinned to match src-tauri/rust-toolchain.toml. Clippy runs with
      # -D warnings, so a floating channel lets a new Rust release fail CI on
      # untouched code.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-${{ matrix.runner }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # On a release this also asserts the tag matches the application version, so
      # a mistagged release fails before any installer is attached to it.
      - name: Verify synchronized release version
        run: npm run check:version

      - name: Build desktop packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "localhost-hub-[version]-[platform]-[arch]-[bundle]"
          # The release this run belongs to: the draft created for the tag, or the
          # release that was published by hand. Empty on a pull request or a manual
          # run, which leaves the packages as workflow artifacts only.
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || needs.draft.outputs.release_id }}
          releaseAssetNamePattern: "localhost-hub-[version]-[platform]-[arch]-[bundle][setup][ext]"

      - name: Prepare Arch package input
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: cp src-tauri/target/release/bundle/deb/*.deb packaging/arch/localhost-hub.deb

      - name: Build Arch package
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist-arch
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm
              useradd --create-home builder
              cp -R /workspace/packaging/arch /tmp/localhost-hub-arch
              chown -R builder:builder /tmp/localhost-hub-arch
              su builder -c "cd /tmp/localhost-hub-arch && makepkg --nodeps --noconfirm"
              cp /tmp/localhost-hub-arch/*.pkg.tar.zst /workspace/dist-arch/
            '

      - name: Upload Arch workflow artifact
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: localhost-hub-${{ github.sha }}-arch-x86_64
          path: dist-arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

      # tauri-action handles its own bundles; the Arch package is built outside it and
      # so has to be attached here. Uploaded by release id rather than by tag, because
      # a draft release has no tag lookup to resolve against.
      - name: Attach Arch package to the release
        if: runner.os == 'Linux' && (github.event_name == 'release' || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event_name == 'release' && github.event.release.id || needs.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          for package in dist-arch/*.pkg.tar.zst; do
            name=$(basename "$package")
            echo "Attaching ${name} to release ${RELEASE_ID}."
            # The documented asset upload endpoint, on its own host. Used directly
            # rather than through `gh release upload`, which resolves a release by tag
            # — and a draft release's tag does not resolve.
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/zstd" \
              --data-binary @"$package" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              > /dev/null
          done
