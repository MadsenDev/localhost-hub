name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized release version
        run: npm run check:version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --run

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Pinned to match src-tauri/rust-toolchain.toml. Clippy runs with
      # -D warnings, so a floating channel lets a new Rust release fail CI on
      # untouched code.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo fmt --check` is not gated yet: the tree predates rustfmt, so
      # enabling it needs a one-off `cargo fmt` that would touch every file.
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # `cargo test` regenerates src/generated via ts-rs. If the committed
      # bindings differ, the Rust types changed without the TypeScript side
      # being updated, which is exactly the drift this replaces.
      - name: Verify generated TypeScript bindings are current
        run: |
          if ! git diff --exit-code --stat -- src/generated; then
            echo "::error::src/generated is stale. Run 'cargo test' in src-tauri/ and commit the result."
            exit 1
          fi
